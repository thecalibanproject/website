name: Docs site

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - .github/workflows/docs-site.yml
  pull_request:
    paths:
      - docs-site/**
      - .github/workflows/docs-site.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Check, build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      # The docs site is self-contained: it reads nothing outside docs-site/.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7 requires node >= 22.12
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # TypeScript is pinned to 6.x: astro check does not support TypeScript 7.
      - run: npm run check
      # Builds the site, then checks dashes, internal links, the console link contract,
      # offline loads and the Pagefind index.
      - run: npm run verify
